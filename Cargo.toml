[package]
name = "stm-graphics"
version = "0.1.0"
edition = "2021"

[dependencies]
embedded-graphics = "0.8.1"
heapless = "0.8.0"
format_no_std = "1.2.0"
defmt = "0.3.10"
profont = "0.7.0"
embedded-plots = { path = "../embedded-plots" }
embedded-graphics-core = "0.4.0"
libm = "0.2.11"
static_cell = "2.1.0"
embassy-sync = { path = "../embassy/embassy-sync", version = "0.6.1", features = ["defmt"] }

embedded-graphics-simulator = {  version = "0.7.0", optional = true }

[features]
simulator = ["dep:embedded-graphics-simulator"]


[profile.release]
opt-level = 3
strip = "symbols"
lto = true
