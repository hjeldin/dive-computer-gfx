[package]
name = "stm-graphics"
version = "0.1.0"
edition = "2021"

[dependencies]
embedded-graphics = "0.8.1"
embedded-text = "0.7.2"
embedded-layout = "0.4.1"
tinybmp = "0.6.0"
tinytga = "0.5.0"
heapless = "0.8.0"
format_no_std = "1.2.0"
defmt = "0.3.10"
profont = "0.7.0"
embedded-plots = { path = "../embedded-plots" }
embedded-graphics-core = "0.4.0"
libm = "0.2.11"
static_cell = "2.1.0"
embassy-sync = { path = "../embassy/embassy-sync", version = "0.6.1", features = ["defmt"] }
# once_cell = "1.20.2"

#[dev-dependencies]
embedded-graphics-simulator = "0.7.0"

[profile.release]
opt-level = 3
strip = "symbols"
lto = true
